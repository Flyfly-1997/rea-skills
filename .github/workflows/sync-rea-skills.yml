name: Sync REA Skills

on:
  schedule:
    # UTC 01:00 = 北京时间每天 09:00
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rea-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download official REA skill
        shell: bash
        run: |
          set -euo pipefail

          upstream="$RUNNER_TEMP/rea-upstream"

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            --branch main \
            https://github.com/morluto/rea.git \
            "$upstream"

          git -C "$upstream" sparse-checkout set \
            .agents/skills/reverse-engineer-anything

          test -s \
            "$upstream/.agents/skills/reverse-engineer-anything/SKILL.md"
          test -s "$upstream/LICENSE"

      - name: Sync skill files
        shell: bash
        run: |
          set -euo pipefail

          upstream="$RUNNER_TEMP/rea-upstream"
          source="$upstream/.agents/skills/reverse-engineer-anything"
          destination="skills/reverse-engineer-anything"

          mkdir -p "$destination"

          # 同步整个 Skill，包括 references。
          # 官方删除的文件也会从这个目标目录删除。
          rsync -a --delete "$source/" "$destination/"

          # 随分发文件保留上游许可证。
          cp "$upstream/LICENSE" "$destination/LICENSE"

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git add -- skills/reverse-engineer-anything

          # 内容没有变化时，不创建空提交。
          if git diff --cached --quiet; then
            echo "REA skill is already up to date."
            exit 0
          fi

          upstream="$RUNNER_TEMP/rea-upstream"
          upstream_commit="$(git -C "$upstream" rev-parse HEAD)"

          {
            printf '# REA Skill 来源\n\n'
            printf '上游仓库：https://github.com/morluto/rea\n\n'
            printf '上游目录：`.agents/skills/reverse-engineer-anything`\n\n'
            printf '最近一次内容同步的来源提交：`%s`\n' \
              "$upstream_commit"
          } > UPSTREAM.md

          git add -- UPSTREAM.md

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore(skills): sync REA skill"
          git push origin HEAD
